name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  test:
    name: Test sushii-worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install sushii-worker dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck sushii-worker
        run: cd packages/sushii-worker && bun run typecheck

      - name: Check interaction defers are justified
        run: cd packages/sushii-worker && bun scripts/check-defer.ts && bun test ./scripts/check-defer.test.ts

      - name: Check docs source citations
        working-directory: ./docs
        run: |
          bun install --frozen-lockfile
          bun run check:sources

      - name: Initialize database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f packages/sushii-worker/drizzle/init.sql

      - name: Run drizzle database migrations
        working-directory: ./packages/sushii-worker
        run: |
          cp .env.ci .env
          bun run drizzle-kit migrate

      - name: Run unit tests
        env:
          # For some reason ryuk causes the testcontainer log wait to fail:
          #  error: Log message "/.*Started.*/" not received after 60000ms
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          cp ./packages/sushii-worker/.env.ci ./packages/sushii-worker/.env
          cd ./packages/sushii-worker
          bun test --timeout 30000

      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          cd ./packages/sushii-worker
          bun test --timeout 30000 ./tests/integration/

  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get short SHA
        id: sha
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Read asset revision
        id: assets
        shell: bash
        run: |
          revision=$(cat packages/sushii-worker/asset-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid asset revision" >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          file: ./packages/sushii-worker/Dockerfile
          build-args: |
            GIT_HASH=${{ steps.sha.outputs.sha_short }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            ASSET_REVISION=${{ steps.assets.outputs.revision }}
          tags: |
            ghcr.io/sushiibot/sushii-worker:latest
            ghcr.io/sushiibot/sushii-worker:${{ steps.sha.outputs.sha_short }}
          cache-from: type=registry,ref=ghcr.io/sushiibot/sushii-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/sushiibot/sushii-worker:buildcache,mode=max

  deploy-staging:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # apps deploys staging on its own (sushii-ansible roles/pull_deploy): this bumps the tag and waits for
    # its status, which is mirrored onto this commit with a Grafana log link.
    permissions:
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/pull-deploy.yml@5a916701cc2f2d875387aef78c9b8ecc273caec7 # pull-deploy
    with:
      service: sushii-bot/sushii-bot-staging
      image_version: ${{ needs.docker-build.outputs.sha_short }}
      host: apps
      environment: staging
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  deploy-production:
    needs: [docker-build, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # sushii-bot releases production on its own (sushii-ansible roles/pull_deploy, blue/green) once this
    # approved job bumps the tag; it checks the production approval and runs one release at a time, so any
    # approved run can deploy without waiting for older ones. Approving an older run is a no-op.
    permissions:
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/pull-deploy.yml@5a916701cc2f2d875387aef78c9b8ecc273caec7 # pull-deploy
    with:
      service: sushii-bot/sushii-bot-production
      image_version: ${{ needs.docker-build.outputs.sha_short }}
      host: sushii-bot
      environment: production
      timeout_minutes: 40
      job_timeout_minutes: 50
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  docker-cleanup:
    needs: [docker-build, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/docker-cleanup.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-worker
    permissions:
      packages: write
