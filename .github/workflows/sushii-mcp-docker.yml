name: Build and Deploy sushii-mcp

on:
  push:
    branches:
      - main
    paths:
      - "packages/sushii-mcp/**"
      - "packages/sushii-worker/src/infrastructure/database/schema.ts"
      - "packages/sushii-worker/src/shared/infrastructure/logRedaction.ts"
      - "packages/sushii-worker/package.json"
      - ".github/workflows/sushii-mcp-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          file: ./packages/sushii-mcp/Dockerfile
          tags: |
            ghcr.io/sushiibot/sushii-mcp:latest
            ghcr.io/sushiibot/sushii-mcp:${{ steps.sha.outputs.sha_short }}
          cache-from: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache,mode=max

  deploy:
    needs: docker-build
    # sushii-bot deploys mcp on its own (sushii-ansible roles/pull_deploy): this bumps the tag and waits for
    # its status, which is mirrored onto this commit with a Grafana log link.
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@86493aecc426db554f9f3f220225516c01a9c110 # release preset
    with:
      service: ${{ vars.MCP_SERVICE }}
      host: ${{ vars.MCP_HOST }}
      image_version: ${{ needs.docker-build.outputs.sha_short }}
      environment: sushii-mcp
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  docker-cleanup:
    needs: docker-build
    uses: sushiibot/sushii-workflows/.github/workflows/docker-cleanup.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-mcp
    permissions:
      packages: write
