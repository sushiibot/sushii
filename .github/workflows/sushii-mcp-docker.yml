name: Build and Deploy sushii-mcp

on:
  push:
    branches:
      - main
    paths:
      - "packages/sushii-mcp/**"
      - "packages/sushii-worker/src/infrastructure/database/schema.ts"
      - "packages/sushii-worker/src/shared/infrastructure/logRedaction.ts"
      - "packages/sushii-worker/package.json"
      - ".github/workflows/sushii-mcp-docker.yml"

permissions: {}

jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@3bb8de95bb1bdc4c5368aac3be8af86118290097
    with:
      image_name: ghcr.io/sushiibot/sushii-mcp
      dockerfile: packages/sushii-mcp/Dockerfile

  deploy:
    name: Release verified MCP image
    needs: docker-build
    permissions:
      contents: read
      actions: read
      packages: read
      statuses: write
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@3bb8de95bb1bdc4c5368aac3be8af86118290097
    with:
      target: mcp
      image_name: ghcr.io/sushiibot/sushii-mcp
      artifact_digest: ${{ needs.docker-build.outputs.artifact_digest }}
      environment: sushii-mcp
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
