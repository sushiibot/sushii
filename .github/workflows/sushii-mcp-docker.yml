name: Build and Deploy sushii-mcp

on:
  push:
    branches:
      - main
    paths:
      - "packages/sushii-mcp/**"
      - "packages/sushii-worker/src/infrastructure/database/schema.ts"
      - "packages/sushii-worker/src/shared/infrastructure/logRedaction.ts"
      - "packages/sushii-worker/package.json"
      - ".github/workflows/sushii-mcp-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          file: ./packages/sushii-mcp/Dockerfile
          tags: |
            ghcr.io/sushiibot/sushii-mcp:latest
            ghcr.io/sushiibot/sushii-mcp:${{ steps.sha.outputs.sha_short }}
          cache-from: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache,mode=max

  deploy:
    needs: docker-build
    # sushii-bot deploys mcp on its own (sushii-ansible roles/pull_deploy): this bumps the tag and waits for
    # its status, which is mirrored onto this commit with a Grafana log link.
    permissions:
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/pull-deploy.yml@5a916701cc2f2d875387aef78c9b8ecc273caec7 # pull-deploy
    with:
      service: sushii-bot/sushii-mcp
      image_version: ${{ needs.docker-build.outputs.sha_short }}
      host: sushii-bot
      environment: sushii-mcp
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}

  docker-cleanup:
    needs: docker-build
    uses: sushiibot/sushii-workflows/.github/workflows/docker-cleanup.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-mcp
    permissions:
      packages: write
