name: Docs

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./docs

      - name: Build Docs
        run: bun run build
        working-directory: ./docs
        env:
          NEXT_PUBLIC_SUSHII_STATS_URL: ${{ vars.NEXT_PUBLIC_SUSHII_STATS_URL }}

      - name: Check critical legal pages
        working-directory: ./docs
        run: |
          grep -q "Interpretation and Definitions" out/privacy.html \
            || (echo "FAIL: /privacy is missing expected Privacy Policy content" && exit 1)
          grep -q "Terms of Service" out/tos.html \
            || (echo "FAIL: /tos is missing expected Terms of Service content" && exit 1)
          echo "OK: /privacy and /tos verified"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: github-pages
          path: ./docs/out/

  deploy:
    name: Deploy Docs
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v3.0.2-node.24
        with:
          artifact_name: github-pages
