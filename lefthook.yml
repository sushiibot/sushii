output:
  - failure

pre-commit:
  commands:
    check-bundled-assets:
      run: bun packages/sushii-worker/scripts/check-bundled-assets.ts
    check-doc-sources:
      run: |
        if git diff --cached --name-only | grep -qE "^(packages/sushii-worker/src/|docs/content/docs/|docs/scripts/check-sources\.ts)"; then
          cd docs && bun run check:sources
        fi
    check-defer:
      run: |
        if git diff --cached --name-only | grep -qE "^packages/sushii-worker/(src/|scripts/check-defer)"; then
          cd packages/sushii-worker && bun scripts/check-defer.ts
        fi
    check-emoji-types:
      run: |
        if git diff --cached --name-only | grep -qE "^packages/sushii-worker/src/features/bot-emojis/domain/BotEmojiName\.ts"; then
          cd packages/sushii-worker && bun typecheck
        fi

commit-msg:
  commands:
    conventional-commit:
      run: bun packages/sushii-worker/scripts/check-commits.ts message {1}

pre-merge-commit:
  commands:
    no-merge-commits:
      run: |
        echo "Merge commits are not allowed. Rebase onto the target or squash instead (git rebase main, git merge --ff-only, git merge --squash)." >&2
        exit 1

pre-push:
  commands:
    check-pushed-commits:
      use_stdin: true
      run: bun packages/sushii-worker/scripts/check-commits.ts pre-push
